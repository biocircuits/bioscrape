[build-system]
requires = ["setuptools>=64", "setuptools-scm>=9.2", "Cython", "numpy", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Bioscrape"
dynamic = ["version"]
description = "Biological Modeling, Simulation, and Inference"
authors = [{name='Ayush Pandey'},
           {name='William Poole'},
           {name='Anandh Swaminathan'},
           {name='Richard M Murray'}]
classifiers=[
        'Development Status :: 5 - Production/Stable',
        'Intended Audience :: Science/Research',
        'License :: OSI Approved :: BSD License',
        'Programming Language :: Cython',
        'Programming Language :: Python',
        'Programming Language :: Python :: 3',
        'Topic :: Software Development',
        'Topic :: Scientific/Engineering',
        'Operating System :: OS Independent',
    ]
license = {file = "LICENSE"}
readme = "README.md"
keywords=["SBML", "synthetic biology", "modeling",
          "Chemical Reaction Network", "CRN simulator", "stochastic",
          "parameter inference"]
dependencies = [
    "numpy>=1.16.5",
    "matplotlib",
    "pytest",
    "scipy>=1.5.4",
    "cython",
    "python-libsbml",
    "beautifulsoup4",
    "sympy",
    "emcee>=3.0.2",
    "pandas",
    "corner",
    "lmfit"
]
requires-python = ">=3.9"

[tool.setuptools_scm]

[project.optional-dependencies]
test = [
  "pytest",
]

[project.urls]
"Homepage" = "https://bioscrape.readthedocs.io/en/latest/"
"Bug Tracker" = "https://github.com/biocircuits/bioscrape/issues"

[tool.setuptools]
packages = ["bioscrape"]
include-package-data = true
package-dir = {"bioscrape"="bioscrape"}

[tool.setuptools.exclude-package-data]
"*" = ["*.c", "*.h"]

[tool.cibuildwheel]
build = [
    "cp39-*",
    "cp310-*",
    "cp311-*",
    "cp312-*",
    "cp313-*",
    "cp314-*",
]

skip = [
    "*-musllinux*",
]

test-command = "python -c \"import bioscrape; import bioscrape.simulator; import bioscrape.types; print('bioscrape wheel import OK')\""

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
